name: Build and push image to ACR

# Builds the container image, pushes it to the `diracwebsite` Azure Container
# Registry (repository-scoped push token: ACR_USERNAME / ACR_PASSWORD), then
# rolls it out to the `dirac-website` Azure Container App via GitHub OIDC
# (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: acr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # GitHub OIDC token for azure/login
  contents: read

env:
  REGISTRY: diracwebsite.azurecr.io
  IMAGE: dirac-website

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy: roll the freshly-pushed image onto the Container App (main only) ──
      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        if: github.ref == 'refs/heads/main'
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name ${{ env.IMAGE }} \
            --resource-group dirac \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
